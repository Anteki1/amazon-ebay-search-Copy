<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Amazon &amp; eBay Item Search</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color-scheme:light}body{margin:0;background:#f2f5fa;color:#182536}.wrap{max-width:640px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:18px;box-shadow:0 5px 24px #172b4d18;padding:24px}h1{font-size:1.7rem;margin:0 0 8px}.hint{color:#526174;margin:0 0 20px}label{display:block;font-weight:650;margin:14px 0 6px}input,select{box-sizing:border-box;width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid #aeb9c6;border-radius:10px;background:#fff;color:#182536}input:focus,select:focus{outline:3px solid #c6e2ff;border-color:#1673cb}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shop{font-size:19px;padding:13px;border:2px solid #aeb9c6;background:#fff;border-radius:12px;cursor:pointer;font-weight:700}.shop[aria-pressed=true]{border-color:#1166bc;background:#e7f2ff}.go{width:100%;font-size:21px;font-weight:750;background:#1265b2;color:white;border:0;border-radius:12px;padding:16px;margin-top:22px;cursor:pointer}.note{font-size:14px;color:#5b6674;margin:12px 0 0}@media(max-width:420px){.panel{padding:17px}.pair{grid-template-columns:1fr 1fr;gap:9px}h1{font-size:1.4rem}}
</style></head><body><main class="wrap"><section class="panel"><h1>Amazon &amp; eBay Item Search</h1><p class="hint">Search by item, color, shoe or clothing size, and mouse-selectable price range.</p><label>Choose store</label><div class="shops"><button type="button" class="shop" id="amazon" aria-pressed="true">Amazon</button><button type="button" class="shop" id="ebay" aria-pressed="false">eBay</button></div><form id="searchForm"><label for="item">Item</label><input id="item" placeholder="e.g. men's sneakers" required><div class="pair"><div><label for="color">Color (optional)</label><select id="color"><option value="">Any color</option><option>Black</option><option>White</option><option>Gray</option><option>Blue</option><option>Red</option><option>Green</option><option>Brown</option><option>Beige</option><option>Pink</option><option>Purple</option><option>Yellow</option><option>Orange</option><option>Gold</option><option>Silver</option><option value="other">Other color…</option></select><input id="otherColor" style="display:none;margin-top:8px" placeholder="Type another color" aria-label="Other color"></div><div><label for="sizeType">Size category</label><select id="sizeType"><option value="">No size</option><option value="shoe">US shoe size</option><option value="clothing">Clothing size</option><option value="other">Other size</option></select><label for="size" id="sizeLabel">Size</label><select id="size" disabled><option value="">Choose category first</option></select><input id="otherSize" style="display:none;margin-top:8px" placeholder="Enter size" aria-label="Other size"></div></div><label for="priceRange">Price range (choose with mouse)</label><select id="priceRange"><option value="">Any price</option><option value="0-10">Under $10</option><option value="10-25">$10–$25</option><option value="25-50">$25–$50</option><option value="50-100">$50–$100</option><option value="100-200">$100–$200</option><option value="200-500">$200–$500</option><option value="500-1000">$500–$1,000</option><option value="1000-">$1,000 and up</option><option value="custom">Custom range…</option></select><div class="pair" id="customPrices" style="display:none"><div><label for="min">Minimum price ($)</label><input id="min" type="number" min="0" step="0.01" placeholder="20"></div><div><label for="max">Maximum price ($)</label><input id="max" type="number" min="0" step="0.01" placeholder="60"></div></div><label for="condition">Condition</label><select id="condition"><option value="any">Any</option><option value="new">New</option><option value="used">Used</option><option value="refurbished">Refurbished / Renewed</option></select><label for="sort">Sort results</label><select id="sort"><option value="best">Best Match</option><option value="low">Lowest Price First</option><option value="high">Highest Price First</option><option value="reviews">Customer Reviews (Amazon)</option></select><button class="go" type="submit" id="searchButton">Search Amazon</button><p class="note">Choose US shoe sizes or clothing sizes from a menu. Sizes are added to search keywords; store filters and results may vary.</p></form></section></main><script>
(function(){'use strict';let store='amazon';const $=id=>document.getElementById(id);function choose(next){store=next;$('amazon').setAttribute('aria-pressed',String(next==='amazon'));$('ebay').setAttribute('aria-pressed',String(next==='ebay'));$('sort').value=next==='ebay'?'low':'best';$('searchButton').textContent='Search '+(next==='ebay'?'eBay':'Amazon');} $('color').addEventListener('change',function(){const other=this.value==='other';$('otherColor').style.display=other?'block':'none';$('otherColor').required=other;if(other)$('otherColor').focus();}); const shoeSizes=['4','4.5','5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10','10.5','11','11.5','12','12.5','13','14','15','16'];const clothingSizes=['XXS','XS','S','M','L','XL','XXL','3XL','4XL','5XL'];$('sizeType').addEventListener('change',function(){const type=this.value,sel=$('size');sel.innerHTML='';$('otherSize').style.display=type==='other'?'block':'none';sel.style.display=type==='other'?'none':'block';sel.disabled=!type||type==='other';$('sizeLabel').textContent=type==='shoe'?'US shoe size':type==='clothing'?'Clothing size':'Size';const choices=type==='shoe'?shoeSizes:type==='clothing'?clothingSizes:[];const first=document.createElement('option');first.value='';first.textContent=type?'Any size':'Choose category first';sel.appendChild(first);choices.forEach(size=>{const opt=document.createElement('option');opt.value=size;opt.textContent=size;sel.appendChild(opt);});}); $('priceRange').addEventListener('change',function(){$('customPrices').style.display=this.value==='custom'?'grid':'none';}); $('amazon').addEventListener('click',()=>choose('amazon'));$('ebay').addEventListener('click',()=>choose('ebay'));$('searchForm').addEventListener('submit',function(e){e.preventDefault();const val=id=>$(id).value.trim();const item=val('item'),color=val('color')==='other'?val('otherColor'):val('color'),size=val('sizeType')==='other'?val('otherSize'):val('size'),range=val('priceRange'),min=range==='custom'?val('min'):(range?range.split('-')[0]:''),max=range==='custom'?val('max'):(range?range.split('-')[1]:''),condition=val('condition'),sort=val('sort');if(!item)return;if(min!==''&&max!==''&&Number(min)>Number(max)){alert('Minimum price cannot exceed maximum price.');return;}const words=[item,color,size].filter(Boolean);const p=new URLSearchParams();let url;if(store==='ebay'){if(condition==='refurbished')words.push('refurbished');p.set('_nkw',words.join(' '));if(min)p.set('_udlo',min);if(max)p.set('_udhi',max);if(condition==='new')p.set('LH_ItemCondition','1000');if(condition==='used')p.set('LH_ItemCondition','3000');if(sort==='low')p.set('_sop','15');if(sort==='high')p.set('_sop','3');url='https://www.ebay.com/sch/i.html?'+p.toString();}else{if(condition!=='any')words.push(condition==='refurbished'?'renewed':condition);p.set('k',words.join(' '));if(min)p.set('low-price',min);if(max)p.set('high-price',max);if(sort==='low')p.set('s','price-asc-rank');if(sort==='high')p.set('s','price-desc-rank');if(sort==='reviews')p.set('s','review-rank');url='https://www.amazon.com/s?'+p.toString();}window.open(url,'_blank','noopener,noreferrer');});})();
</script></body></html>
